<!doctype html>
<meta charset="utf-8">
<title>Chromium test</title>
<style>
body { background: #073b4c; color: white; font: 26px sans-serif; margin: 36px; }
button, input { font: 26px sans-serif; padding: 12px; }
label { display: inline-block; background: white; color: black; padding: 12px; }
#status { background: #118ab2; padding: 20px; }
input { appearance: none; box-sizing: border-box; width: 400px; height: 60px; line-height: 32px; background: white; color: black; }
#count { background: #06d6a0; color: #062f21; padding: 16px; }
</style>
<h1>Chromium is rendering</h1>
<p id="status">Ready to benchmark</p>
<button id="button">Count clicks</button>
<button id="benchmark">Run benchmark</button>
<label for="input">Type here</label>
<p id="count">Clicks: 0</p>
<input id="input" autofocus>
<p id="typed"></p>
<canvas id="scene" width="400" height="160" style="display:none;position:fixed;left:480px;top:350px;border:2px solid white"></canvas>
<script>
const log = (event, data) => console.log('BW_CHROMIUM_JSON ' + JSON.stringify({ event, ...data }));
let clicks = 0;
document.getElementById('button').onclick = () => {
  document.getElementById('count').textContent = 'Clicks: ' + (++clicks);
  document.title = 'BW_CLICK_' + clicks;
  log('click', { clicks });
};
document.getElementById('input').oninput = event => {
  document.getElementById('typed').textContent = 'Typed: ' + event.target.value;
  log('input', { text: event.target.value });
};
document.getElementById('input').onfocus = () => log('focus', { target: 'input', hasFocus: document.hasFocus() });
document.getElementById('input').onblur = () => log('blur', { target: 'input' });
for (const event of ['mousedown', 'mouseup']) document.addEventListener(event, e => log(event, { target: e.target.id, x: e.clientX, y: e.clientY, button: e.button }));
document.title = 'BW_RENDER_OK';
log('ready', { userAgent: navigator.userAgent });
const median = values => {
  const sorted = [...values].sort((a, b) => a - b);
  return (sorted[Math.floor((sorted.length - 1) / 2)] + sorted[Math.ceil((sorted.length - 1) / 2)]) / 2;
};
async function graphicsBenchmark() {
  const canvas = document.getElementById('scene');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const colors = ['#ff5b5b', '#00cf91', '#4db3ff', '#ffe16b'];
  const longScene = new URLSearchParams(location.search).get('longScene') === '1';
  const warmupFrames = longScene ? 30 : 5, frames = longScene ? 300 : 30;
  const intervals = [], drawSamples = [];
  let previous;
  for (let frame = 0; frame < warmupFrames + frames; frame++) {
    const timestamp = await new Promise(resolve => requestAnimationFrame(resolve));
    if (frame >= warmupFrames) intervals.push(timestamp - previous);
    previous = timestamp;
    const started = performance.now();
    ctx.fillStyle = '#17324d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let shape = 0; shape < 12; shape++) {
      ctx.fillStyle = colors[shape % colors.length];
      ctx.fillRect((frame * 7 + shape * 41) % (canvas.width - 32),
        (shape * 19 + frame * 3) % (canvas.height - 24), 30, 20);
    }
    ctx.font = '20px sans-serif';
    ctx.fillStyle = 'white';
    ctx.fillText('Chromium 2D: ' + frame, 12, 28);
    if (frame >= warmupFrames) drawSamples.push(performance.now() - started);
  }
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let pixelHash = 2166136261, colorful = 0;
  for (let offset = 0; offset < pixels.length; offset++) pixelHash = Math.imul(pixelHash ^ pixels[offset], 16777619) >>> 0;
  for (let offset = 0; offset < pixels.length; offset += 4) {
    if (Math.max(pixels[offset], pixels[offset + 1], pixels[offset + 2]) - Math.min(pixels[offset], pixels[offset + 1], pixels[offset + 2]) > 100) colorful++;
  }
  const result = { workload: 'canvas-scene-v1', frames, warmupFrames, intervals, drawSamples, pixelHash, colorful };
  // Report milliseconds to three decimals so 300 samples fit in one Wine log.
  result.intervals = intervals.map(ms => Math.round(ms * 1000) / 1000);
  log('graphics', result);
  return result;
}
document.getElementById('benchmark').onclick = () => setTimeout(async () => {
  const samples = [], iterations = 1000000;
  let checksum = 0;
  for (let trial = 0; trial < 8; trial++) {
    let sum = 0;
    const start = performance.now();
    for (let i = 0; i < iterations; i++) sum = (sum + i) | 0;
    samples.push(performance.now() - start);
    checksum = sum;
  }
  document.getElementById('status').textContent = 'JavaScript OK. Warm loop: ' + median(samples.slice(4)) + ' ms';
  log('benchmark', { workload: 'integer-sum-v2', iterations, samples, checksum });
  const graphics = await graphicsBenchmark();
  document.getElementById('status').textContent += '; scene callback: ' + Math.round(median(graphics.intervals)) + ' ms';
}, 100);
</script>

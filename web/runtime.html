<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Wine runtime</title><style>body{margin:0;background:#080c11;color:#acbfd2;font:12px system-ui}#status{padding:10px}canvas{display:block;max-width:100%;margin:auto}canvas[hidden]{display:none}#vkCanvas{position:absolute;top:34px;left:50%;transform:translateX(-50%);pointer-events:none}#output{display:none}</style><script src="../sparse-memfs.js"></script></head><body><div id="status">Loading…</div><progress id="progress" hidden></progress><span id="spinner" hidden></span><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><canvas id="gl64canvas" width="1024" height="1024" hidden></canvas><textarea id="output" readonly></textarea>
<script type="module">
import { getPackage } from '../storage.mjs';
import { safePath, checkEntries, folderLimits } from '../files.mjs';
const query = new URLSearchParams(location.search);
const id = query.get('installation');
// Lazy game payload (M8): a game zip mounted on-demand via bw64url/HTTP Range,
// bypassing IndexedDB, the 768 MiB checkEntries cap, and the MEMFS copy.
// Query: ?gamezip=<url>&gamezipsize=<bytes>&exe=<path>
// The zip must contain home/username/apps/... paths (like prefix64.zip).
const gameZipUrl = query.get('gamezip');
const gameZipSize = Number(query.get('gamezipsize') || 0);
const pkg = (!gameZipUrl && id && id !== 'demo' && !id.startsWith('demo-')) ? await getPackage(id) : null;
const send = (type, data) => parent.postMessage({ wine: true, type, data }, location.origin);
window.addEventListener('error', event => send('error', event.message || 'Runtime error. Restart the program to try again.'));
window.addEventListener('unhandledrejection', event => send('error', event.reason?.message || String(event.reason)));
window.bwRuntimeStatus = text => send('status', text);
window.bwRuntimeLog = text => send('log', text);
window.bwRuntimeError = text => send('error', text);
window.bwGpuFrame = json => send('gpu', JSON.parse(json));
// vk64 page tier (tasks/p1-final.md §2.9): the Vulkan bridge hops ONE frame
// manifest per present into window.bwVkFrame, which becomes a 'vk' message to
// the app shell — the sibling of the 'gpu' branch. The string is forwarded
// unparsed on purpose: web/vkwebgpu.mjs owns decoding (and the host manifest's
// missing '}' on its vs/fs wrapper objects is repaired there, not here, so a
// guest frame can never fault this bridge).
window.bwVkFrame = json => send('vk', json);
// Schema v2 (tasks/schema-v2.md): the bridge hops binary chunk bytes per
// MAIN_THREAD_EM_ASM into window.bwVkChunk. Forwarded to the app shell as a
// 'vk2' message with the buffer transferred (zero-copy); the top-level
// self-host path below routes it straight into the tier instead.
window.bwVkChunk = (bytes, flags) => {
  const msg = { wine: true, type: 'vk2', data: { bytes, flags } };
  try { parent.postMessage(msg, location.origin, [bytes.buffer]); }
  catch (e) { parent.postMessage(msg, location.origin); }
};
// When THIS page is the top-level one (window.parent === window — the scratch-vk
// probe drives /runtime/index.html directly) there is no app shell to own the
// renderer, so the page hosts the page tier itself: the tier module is imported
// lazily on the first frame (same fire-and-forget shape as the ?naga=1 lane) and
// every frame after it is queued inside the module.
if (window.parent === window) window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.wine !== true) return;
  if (e.data.type !== 'vk' && e.data.type !== 'vk2') return;
  window.bwVkTierReady ||= import('../vkwebgpu.mjs')
    .then(m => (window.bwVkTier = m.installVkPageTier()))
    .catch(err => { window.bwVkTierReady = null; console.warn('vk64: page tier module load failed', err); window.bwRuntimeLog('vk64: page tier module load failed — ' + (err.message || err)); });
  if (e.data.type === 'vk') window.bwVkTierReady.then(tier => tier.frame(e.data.data)).catch(() => {});
  else window.bwVkTierReady.then(tier => tier.chunk(e.data.data.bytes, e.data.data.flags)).catch(() => {});
});
// C1 naga observation lane (?naga=1, default OFF — contract /tmp/c1-contract.md):
// wrap WebGL2RenderingContext.prototype.shaderSource to capture the post-bridge
// ES 3.00 guest shader sources, lift them to GLSL 450 and shadow-translate to
// WGSL. Fire-and-forget dynamic import (lazy: zero extra bytes when OFF, 2 MB
// naga_bg.wasm only at the first captured shader); it resolves in ms while the
// launcher still has a rootfs download + wine boot ahead of it, so the wrap is
// installed long before wined3d's first shader. Failure logs once and leaves
// ANGLE untouched — this lane never changes the render path.
if (query.get('naga') === '1') {
  import('../naga-rt.mjs').then(m => m.installNagaCapture()).catch(err => {
    console.warn('naga: module load failed — ANGLE fallback active', err);
    window.bwRuntimeLog('naga: module load failed — ANGLE fallback active');
  });
}
if (gameZipUrl && gameZipSize > 0) {
  const exe = safePath(query.get('exe') || '');
  if (!exe) throw new Error('Executable path required with gamezip');
  const args = JSON.parse(query.get('args') || '[]');
  if (!Array.isArray(args) || args.length > 32 || args.some(a => typeof a !== 'string' || a.length > 4096 || /[\x00-\x1f]/.test(a))) throw new Error('Invalid program arguments');
  // Absolutize: the sync fetch runs on pthread workers whose base URL is not the page's.
  const absGameUrl = new URL(gameZipUrl, location.href).href;
  window.bwGameZipSpec = 'bw64url:' + gameZipSize + ';' + absGameUrl + '|' + gameZipSize;
  console.log('lazy game: mounting ' + gameZipSize + ' bytes from ' + absGameUrl);
  window.bwProgramArgv = ['Z:\\home\\username\\apps\\' + exe.replaceAll('/', '\\'), ...args];
  window.bwWorkingDirectory = '/home/username/apps/' + exe.split('/').slice(0, -1).join('/');
  // Optional second lazy overlay (?overlay=<url>&overlaysize=<bytes>): a small
  // zip with home/username/apps/... paths (e.g. DXVK d3d9.dll + libvulkan shim)
  // mounted AFTER the game zip so its files win. Same bw64url: shape.
  const overlayUrl = query.get('overlay');
  const overlaySize = Number(query.get('overlaysize') || 0);
  if (overlayUrl && overlaySize > 0) {
    const absOverlayUrl = new URL(overlayUrl, location.href).href;
    window.bwOverlaySpec = 'bw64url:' + overlaySize + ';' + absOverlayUrl + '|' + overlaySize;
    console.log('lazy overlay: mounting ' + overlaySize + ' bytes from ' + absOverlayUrl);
  }
  // No bwPrepareFilesystem: game files are served lazily from the zip mount.
  // Writes (saves/configs) land in the MEMFS upper layer via the overlay.
} else if (pkg) {
  checkEntries(pkg.files, folderLimits);
  const exe = safePath(query.get('exe') || '');
  if (!pkg.files.some(f => f.path === exe)) throw new Error('Executable is absent from package');
  const args = JSON.parse(query.get('args') || '[]');
  if (!Array.isArray(args) || args.length > 32 || args.some(a => typeof a !== 'string' || a.length > 4096 || /[\x00-\x1f]/.test(a))) throw new Error('Invalid program arguments');
  window.bwProgramArgv = ['Z:\\home\\username\\apps\\' + exe.replaceAll('/', '\\'), ...args];
  window.bwWorkingDirectory = '/home/username/apps/' + exe.split('/').slice(0, -1).join('/');
  window.bwPrepareFilesystem = async FS => {
    // Install missing base files only: writable persisted changes/saves take priority.
    for (const file of pkg.files) {
      const dest = '/root/home/username/apps/' + safePath(file.path);
      try { FS.lstat(dest); continue; } catch {}
      FS.mkdirTree(dest.slice(0, dest.lastIndexOf('/')));
      FS.writeFile(dest, new Uint8Array(await file.blob.arrayBuffer()));
    }
  };
}
const script = document.createElement('script');
script.src = 'wine64-launcher.js?v=__RUNTIME_VERSION__';
script.onerror = () => send('status', 'Runtime loader download failed');
document.body.append(script);
if (query.get('gpu') === '1') {
  const timer = setInterval(() => {
    if (!window.bwRuntime?.ready()) return;
    clearInterval(timer);
    window.bwRuntime.call('bw64_gpu_capture', ['number'], [1]);
  }, 100);
}
</script></body></html>

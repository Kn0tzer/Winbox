# Build the current browser app, verify its stack, and publish a generated export.
# Binary runtime inputs are immutable release assets pinned by SHA256 in
# tools/browser/runtime-assets.json; the emulator is compiled from this commit.
name: Deploy browser emulator to Pages

on:
  push:
    branches: [master]
    paths:
      - "source/**"
      - "include/**"
      - "platform/**"
      - "lib/**"
      - "project/emscripten/**"
      - "project/linux/**"
      - "web/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore and verify pinned runtime assets
        run: pnpm bootstrap
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Build emulator and current browser export
        run: tools/bw64-build.sh
        env:
          JOBS: 2
          BW64_BUILD_OWNER: github-actions
      - name: Check types and complete fast test suite
        run: |
          pnpm typecheck
          pnpm test
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Native CPU, JIT and Vulkan bridge checks
        run: |
          bash scripts/build-jit-wasm.sh --selftest-only
          python3 tools/vkd3d/tests/run-native.py
          make -C project/linux test JOBS=2
          project/linux/Build/Test/boxedwine 0 0 1
          make -C project/linux x64 JOBS=2
          project/linux/Build/X64Headless/boxedwine --x64-selftest
          make -C project/linux x64-cache JOBS=2
          BW64_JIT=1 BW64_JIT_VERIFY=1 project/linux/Build/X64HeadlessCache/boxedwine --x64-selftest
      - name: Prepare same-origin rootfs parts
        run: python3 tools/browser/prepare-pages.py dist
      - name: Browser smoke (Notepad first window and visible canvas)
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { serve } from "./tools/browser/serve.mjs"; await serve("dist", 8077);' &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -fs -o /dev/null http://127.0.0.1:8077/runtime/index.html && break
            sleep 0.2
          done
          node project/emscripten/smoke-test.mjs \
            "http://127.0.0.1:8077/runtime/index.html?chunked=1&p=notepad.exe&persist=0&lazy=0" \
            --timeout=420000 --attempts=2
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
